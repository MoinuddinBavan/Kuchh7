name: Build macOS Intel

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-macos-intel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos-intel:
    name: Build Kuche7 Intel app and DMG
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      PYTHON_BIN: python3
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      QT_QPA_PLATFORM: offscreen
      PYVISTA_OFF_SCREEN: "true"
      KUCHE7_SKIP_GUI_SMOKE: "1"

    steps:
      - name: Check out private source
        uses: actions/checkout@v4

      - name: Set up Intel Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            release/requirements-macos-intel.txt

      - name: Verify native Intel runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "x86_64"
          python3 -c 'import platform, sys; print(platform.platform()); print(platform.machine()); print(sys.version); assert platform.machine() == "x86_64"'

      - name: Build and audit Intel application
        shell: bash
        run: |
          set -euo pipefail
          chmod +x release/build_macos_intel.sh
          ./release/build_macos_intel.sh

      - name: Prepare downloadable Intel artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -d release/dist-macos-intel/Kuche7.app
          test -f release/dist-macos-intel/Kuche7-v1.0.1-macOS-Intel.dmg
          ditto -c -k --sequesterRsrc --keepParent \
            release/dist-macos-intel/Kuche7.app \
            release/dist-macos-intel/Kuche7-v1.0.1-macOS-Intel.app.zip
          shasum -a 256 \
            release/dist-macos-intel/Kuche7-v1.0.1-macOS-Intel.app.zip \
            release/dist-macos-intel/Kuche7-v1.0.1-macOS-Intel.dmg \
            > release/dist-macos-intel/SHA256SUMS-Intel.txt
          cat release/dist-macos-intel/SHA256SUMS-Intel.txt

      - name: Upload Intel application bundle
        uses: actions/upload-artifact@v4
        with:
          name: Kuche7-v1.0.1-macOS-Intel-app
          path: |
            release/dist-macos-intel/Kuche7-v1.0.1-macOS-Intel.app.zip
            release/dist-macos-intel/Kuche7-v1.0.1-macOS-Intel-compatibility.txt
            release/dist-macos-intel/Kuche7-v1.0.1-macOS-Intel-dependencies.txt
            release/dist-macos-intel/SHA256SUMS-Intel.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload Intel disk image
        uses: actions/upload-artifact@v4
        with:
          name: Kuche7-v1.0.1-macOS-Intel-dmg
          path: |
            release/dist-macos-intel/Kuche7-v1.0.1-macOS-Intel.dmg
            release/dist-macos-intel/Kuche7-v1.0.1-macOS-Intel-compatibility.txt
            release/dist-macos-intel/Kuche7-v1.0.1-macOS-Intel-dependencies.txt
            release/dist-macos-intel/SHA256SUMS-Intel.txt
          if-no-files-found: error
          retention-days: 14
